<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="utf-8" />
  <title>Editor de text ArCom</title>
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='forge/style.css') }}" />
</head>
<body>
  <input type="file" id="fileInput" accept=".txt,.html" />
  <button onclick="openFile()">Obre fitxer</button>
  <button onclick="downloadFile()">Descarrega</button>
  <div id="editor-container"><div id="editor"></div></div>

  <form id="downloadForm" method="post" action="/download" style="display:none;">
    <input type="hidden" name="content" id="hiddenContent" />
  </form>

  <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
  <script>
    var quill = new Quill('#editor', {
      theme: 'snow',
      modules: { toolbar: true }
    });

    function openFile() {
      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          quill.root.innerHTML = e.target.result;
        };
        reader.readAsText(file);
      }
    }

    function downloadFile() {
      const html = quill.root.innerHTML;
      document.getElementById('hiddenContent').value = html;
      document.getElementById('downloadForm').submit();
    }
  </script>
</body>
</html>
